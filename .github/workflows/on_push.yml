name: CI

# Newer Flutter analysis SDKs omit dart:js_util used by the web implementation.
# Upgrade this pin together with the migration to dart:js_interop.
on: [push]

jobs:
  analyze:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.7'
      - run: ./am deps
      - run: ./am analyze --fatal-warnings --fatal-infos

  format:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.7'
      - run: ./am deps
      - run: ./am format --verify

  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.7'
      - run: ./am deps
      - run: ./am test
